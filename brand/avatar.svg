<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#2d45a8"/>
      <stop offset="0.6" stop-color="#1d2f7a"/>
      <stop offset="1" stop-color="#101c4e"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffd56a" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1c4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd56a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gilt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd56a"/>
      <stop offset="0.5" stop-color="#d9891c"/>
      <stop offset="1" stop-color="#7a4a10"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#8ccf9a"/>
      <stop offset="0.7" stop-color="#2f7a6a"/>
      <stop offset="1" stop-color="#143a4a"/>
    </radialGradient>
  </defs>
  <circle cx="512" cy="512" r="512" fill="url(#bg)"/>
  <!-- cone of light from the lamp down onto the table -->
  <path d="M 512 250 L 190 820 L 834 820 Z" fill="url(#cone)"/>
  <ellipse cx="512" cy="800" rx="330" ry="70" fill="url(#pool)"/>
  <!-- the table edge -->
  <rect x="0" y="800" width="1024" height="224" fill="#141f55"/>
  <!-- the thing under the lamp: a small unknown object with the question inside -->
  <circle cx="512" cy="680" r="118" fill="url(#orb)"/>
  <circle cx="512" cy="680" r="118" fill="none" stroke="#fff6d2" stroke-opacity="0.6" stroke-width="6"/>
  <text x="512" y="736" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="900" font-size="150" fill="#fff6d2">?</text>
  <!-- the lamp: arm from the top-left, bell shade, bulb -->
  <path d="M 150 120 Q 330 90 470 190" fill="none" stroke="#2a1f1a" stroke-width="34" stroke-linecap="round"/>
  <path d="M 150 120 Q 330 90 470 190" fill="none" stroke="url(#gilt)" stroke-width="20" stroke-linecap="round"/>
  <path d="M 400 150 L 624 150 L 690 290 L 334 290 Z" fill="url(#gilt)" stroke="#2a1f1a" stroke-width="10" stroke-linejoin="round"/>
  <path d="M 356 285 L 668 285 L 640 300 L 384 300 Z" fill="#fff1c4"/>
  <circle cx="512" cy="300" r="44" fill="#fff6d2"/>
  <circle cx="512" cy="300" r="90" fill="#ffd56a" fill-opacity="0.35"/>
  <!-- gold ring -->
  <circle cx="512" cy="512" r="492" fill="none" stroke="#d9891c" stroke-width="22"/>
</svg>
